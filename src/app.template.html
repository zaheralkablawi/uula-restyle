<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>UULA Restyle</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212e; --muted:#5d6878; --line:#d9dfe7;
  --accent:#1f71de; --accent-soft:#e7effc; --ok:#1f8a4c; --warn:#b4541a; --err:#c62828;
  --f:"UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
.wrap{padding:10px 14px 16px;display:grid;gap:10px}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;display:flex;align-items:center;gap:7px;font-weight:500;direction:ltr;margin-left:auto}
h1 svg{width:30px;height:30px;flex:none}
h1 .bt{display:flex;flex-direction:column;justify-content:center;height:30px}
h1 .root{color:#2072e0;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
h1 .sub{color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ib.updbtn{position:relative;color:#e8590c;border-color:#e8590c}
.updbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:#e8590c;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{50%{transform:scale(1.5);opacity:.5}}
.appmenu{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);padding:5px}
.menu button{display:block;width:100%;font:inherit;font-size:.86rem;text-align:start;background:none;border:0;border-radius:7px;padding:6px 10px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.label{font-size:.78rem;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.84rem;height:32px;border:0;background:var(--panel);color:var(--muted);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.big{font:inherit;font-size:1rem;font-weight:700;height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.big:hover{filter:brightness(1.07)}.big:disabled{background:#c7cfdb;cursor:not-allowed;filter:none}
.big svg{width:20px;height:20px}
.chead{display:flex;align-items:center;gap:7px;font-size:.95rem}.chead b{font-weight:600}.chead svg{color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chk{display:flex;align-items:center;gap:8px;font-size:.84rem;cursor:pointer}
.mini{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:6px;padding:1px 8px;cursor:pointer;height:26px;display:inline-flex;align-items:center;gap:5px}
.mini:hover{border-color:var(--accent);background:var(--accent-soft)}
.num{width:52px;font:inherit;font-size:.84rem;height:26px;border:1px solid var(--line);border-radius:6px;text-align:center}
.tog{display:flex;align-items:center;gap:6px;width:100%;padding:0;border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.tog svg{transition:transform .15s}.tog[aria-expanded="false"] svg{transform:rotate(90deg)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em}
.res{display:grid;gap:4px;font-size:.84rem}
.res .ln{display:flex;gap:6px;align-items:baseline}
.res .ok{color:var(--ok)}.res .warn{color:var(--warn)}.res .err{color:var(--err)}
.res a{color:var(--accent);cursor:pointer;text-decoration:underline;unicode-bidi:isolate}
.note{font-size:.74rem;color:var(--muted)}
.tgroup{display:grid;gap:5px}
.tgroup .gt{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:2px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tbtn{font:inherit;font-size:.8rem;min-height:32px;padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:start;display:flex;align-items:center;gap:7px;line-height:1.3}
.tbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.tbtn:disabled{opacity:.5;cursor:default}
.tbtn i{flex:none;width:14px;height:14px;border-radius:3px;border:1px solid rgb(0 0 0 / .12)}
.modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 40px rgb(0 0 0 / .3)}
.mbox h3{margin:0 0 8px;font-size:1rem}.mbox p{margin:6px 0}.mbox ul{margin:6px 0;padding-inline-start:1.2em}
.mbox .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.credit{text-align:center;font-size:.72rem;color:var(--muted);padding:6px 0 0}
</style></head><body>
<div class="wrap">
  <header>
    <h1><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#1f71de" stroke-width="2.6"/><path fill="#1f71de" d="M16 7.2l2.1 5.6 5.7 2.2-5.7 2.2L16 22.8l-2.1-5.6-5.7-2.2 5.7-2.2z"/><circle cx="22.3" cy="22.3" r="1.9" fill="#1f71de"/></svg><span class="bt"><span class="root">UULA</span><span class="sub">Restyle</span></span></h1>
    <button type="button" class="ib updbtn" id="updBtn" hidden aria-label="تحديث جديد" title="تحديث جديد"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.2 3.2v3.5h-3.5"/></svg><span class="dot"></span></button>
    <div class="appmenu">
      <button type="button" class="ib" id="menuBtn" aria-expanded="false" title="القائمة" aria-label="القائمة"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" hidden>
        <button type="button" id="chkUpd">التحقق من التحديثات</button>
        <button type="button" id="aboutBtn">حول الأداة</button>
      </div>
    </div>
  </header>

  <section class="panel">
    <div class="chead"><svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><path d="M10 2.5l1.7 4.6 4.8 1.8-4.8 1.8L10 15.5l-1.7-4.8-4.8-1.8 4.8-1.8z"/></svg><b>تحويل لستايل علا</b></div>
    <div class="seg" id="scope">
      <button type="button" data-v="cur" aria-pressed="true">الشريحة الحالية</button>
      <button type="button" data-v="all" aria-pressed="false">كل الشرائح</button>
    </div>
    <button type="button" class="big" id="goBtn">تحويل</button>
    <div class="prog" id="prog" hidden><i></i></div>
    <div class="status" id="status" role="status"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="panel">
    <div class="chead"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="14" height="5" rx="1.2"/><rect x="3" y="10" width="6" height="7" rx="1.2"/><rect x="11" y="10" width="6" height="7" rx="1.2"/></svg><b>القوالب</b></div>
    <span class="note">يُضاف القالب تحت آخر عنصر في الشريحة الحالية.</span>
    <div id="tpls" style="display:grid;gap:6px"></div>
    <div class="status" id="tstatus" role="status"></div>
  </section>

  <section class="panel">
    <button type="button" class="tog" id="setTog" aria-expanded="false"><svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>الإعدادات</button>
    <div id="setBody" hidden style="display:grid;gap:9px">
      <label class="chk"><input type="checkbox" id="numChk" checked> ترقيم الصفحات</label>
      <div class="row" id="numRow"><span style="font-size:.84rem">يبدأ الترقيم من الشريحة</span><span style="display:flex;gap:6px;align-items:center"><input type="number" min="1" class="num" id="numStart" value="1"><button type="button" class="mini" id="numHere">الحالية</button></span></div>
      <button type="button" class="mini" id="numAll" style="justify-self:start">تحديث أرقام الصفحات الآن</button>
      <label class="chk"><input type="checkbox" id="wmChk" checked> علامة علا المائية</label>
      <span class="note">التذييل والعلامة المائية يُضافان فقط للشرائح التي ماسترها ليس ماستر علا.</span>
    </div>
  </section>
  <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><button type="button" class="mini" id="modalX" style="margin-top:10px">إغلاق</button></div></div>
  <footer class="credit" dir="ltr">By Zaher Alkablawi <span id="appVer">1.0</span></footer>
</div>
<script>/*JSZIP*/</script>
<script>/*ASSETS*/</script>
<script>/*ENGINE*/</script>
<script>/*TEMPLATES*/</script>
<script>/*APP*/</script>
</body></html>
